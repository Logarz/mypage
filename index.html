/* ===== 深度美术升级：场景作为主角，精简按钮与视觉噪声 ===== */
html{background:#dbecd9}
body{color:#553e2c;background:radial-gradient(circle at 20% 10%,#fff3dc 0,transparent 35%),linear-gradient(135deg,#b0d9ce,#e8edc9 55%,#efd3a4);}
#app{max-width:500px;background:linear-gradient(180deg,#fdf6e5 0%,#fff7e8 50%,#f6ecd6 100%);box-shadow:0 20px 72px #334a3a3d;}
.topbar{height:54px;border:none;box-shadow:none;background:linear-gradient(90deg,#fff7e7,#fff5e5);border-bottom:1px solid #efddbf;}
.brand{font-size:15px;letter-spacing:.015em;color:#78532f}
.brand-mark{font-size:15px;width:29px;height:29px;background:#ffdc7b;border-color:#e9ac50;box-shadow:0 2px #c48c3c;border-radius:50%}
.mini-btn{background:#fffdf6;border:1.5px solid #e1c48b;box-shadow:none;border-radius:99px;font-weight:850}
.game-screen{padding:15px 12px 24px;background:radial-gradient(ellipse at 50% 34%,#fff8df,#f5e9d1 70%);animation:stageIn .4s ease both}
@keyframes stageIn{from{opacity:.5;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.paper-heading{padding:14px 14px 12px 17px;border-radius:24px;border:2px solid #f4dfbb;background:linear-gradient(110deg,#fffdfa 20%,#fff3d7 100%);box-shadow:0 7px 24px #8f663526, 0 3px #e6c28c;min-height:110px;display:flex;justify-content:space-between;gap:9px;align-items:center;overflow:hidden}
.scene-heading-text{position:relative;z-index:1;flex:1;min-width:0;}
.series{color:#b87939;font-size:12px;font-weight:850;letter-spacing:.03em}
.game-title{font-size:29px;font-weight:1000;color:#704329;letter-spacing:-.04em;margin:4px 0 4px;line-height:1.12}
.game-subtitle{font-size:12px;line-height:1.35;color:#987553;margin:0;max-width:230px}
.chapter-pill{position:static;display:inline-block;border:none;box-shadow:none;background:#e3f4d6;color:#498344;font-size:10px;border-radius:100px;padding:4px 9px;margin-top:6px}
.chapter-miniart{flex:0 0 110px;height:98px;margin:-8px -7px -8px 0;border-radius:17px;position:relative;overflow:hidden;box-shadow:0 0 0 3px #fff7e3,0 5px 12px #73502b33;}
.chapter-miniart img{width:100%;height:100%;object-fit:cover}
.chapter-miniart::before{content:"";position:absolute;z-index:1;inset:0;border-radius:17px;box-shadow:inset 0 0 0 2px #ffffff50;pointer-events:none}
.progress-dots{padding:12px 0 12px;gap:7px}.dot{width:38px;height:7px;background:#eadab9;border:0}.dot.active{background:#f2aa3d;box-shadow:0 0 0 3px #ffe9be}.dot.done{background:#89c069;border:0}
.scene-window{height:min(440px,115vw);min-height:380px;border-radius:26px;border:5px solid #fff6dc;outline:2px solid #d7b17a;box-shadow:0 11px 0 #ddb77a,0 19px 24px #764d2f2b,inset 0 0 0 1px #fff9;isolation:isolate}
.scene-back{display:none}
.scene-window::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:0;box-shadow:inset 0 18px 26px #fff5,inset 0 -15px 24px #6b533313}
.scene-caption{background:#fff5dbea;color:#7a4d2d;border:2px solid #fffdf4;border-radius:99px;padding:7px 13px;box-shadow:0 4px 12px #5e3e2226;top:12px;left:11px;font-size:12px;letter-spacing:.04em}
.mine-hills,.mine-ground,.wheatgrass,.workshop-wall,.workshop-window,.workshop-board,.workshop-rolling,.runner-cloud,.runner-city,.road,.lane-mark,.kitchen-tiles,.kitchen-shelf,.prep-counter,.inspect-tiles,.inspect-stove,.inspect-cabinet,.inspect-tile-floor{display:none!important}
/* 游戏主角避免遮挡道具；角色在操作提示区高频亮相 */
.mascot-spot{bottom:-7px;right:-5px;opacity:.93;transform:scale(.72);transform-origin:right bottom;filter:drop-shadow(0 6px 8px #55412255)}
.hud{margin:19px 0 9px;padding:9px 13px;border-radius:17px;border:1.5px solid #ead7b8;box-shadow:none;background:#fffaf1;min-height:48px;font-size:13px;color:#6c4b30}
.hud span:first-child::before{content:"✦ ";color:#f5b74e}
.hud span:last-child{color:#c2783e}
.guide{background:linear-gradient(110deg,#fffdf8,#fff6e2);padding:7px 10px;border:1.5px solid #ebd5b2;box-shadow:0 3px 10px #8f6d3330;min-height:65px;border-radius:18px;margin-top:6px}
.guide-avatar{width:60px}.guide-avatar .mascot{width:60px}.guide-text{font-size:13px;font-weight:700;color:#684831;line-height:1.55}
.controls{margin:15px 1px 2px;gap:11px}.controls>*{min-height:53px}
.gold-btn{background:linear-gradient(#ffe996 0%,#ffc94a 48%,#f5a72b 100%);border:2.5px solid #cf872e;box-shadow:0 5px 0 #ae6b2a,0 11px 20px #ad763833;color:#784319;text-shadow:0 1px #fff2bb;letter-spacing:.015em;position:relative}
.gold-btn:not(:disabled)::before{content:"";position:absolute;top:6px;left:15%;right:15%;height:8px;border-top:1.5px solid #fff9d9aa;border-radius:100%}
.gold-btn:active{transform:translateY(3px);box-shadow:0 2px #ae6b2a}
.soft-btn{border:2px solid #dfbf8a;background:linear-gradient(#fffcf1,#f9e8c8);box-shadow:0 3px #d0ad79;color:#72502f}
.control-note{font-size:11px;color:#9b8366;margin-top:10px;padding:0 4px}
.illustrated-token{width:72px;height:76px;border-radius:22px;filter:drop-shadow(0 6px 5px #63462555);z-index:4}
.illustrated-token::before{content:"";width:55px;height:55px;position:absolute;z-index:-1;border-radius:50%;background:radial-gradient(circle,#fff9dbcc,#ffffff13 76%);box-shadow:0 0 0 1px #ffebb255}
.illustrated-token .ico{width:72px;height:72px}
.token-label{font-size:11px;bottom:-1px;box-shadow:0 3px 6px #39210f25;padding:4px 8px;background:#fff9eaea;border:1.5px solid #efd6aa;color:#76512c}
.miner-post{top:17px;background:linear-gradient(#e8b36d,#bb7b3e);border-color:#87562f;box-shadow:0 5px #613e2a,0 11px 16px #65472a5c}
.miner-post .ico{width:53px;height:53px}
.hook-arm{background:linear-gradient(90deg,#9b7848,#f3e3ad,#876343);box-shadow:0 2px 4px #33231525}
.hook-end{filter:drop-shadow(0 3px 2px #33231344)}
/* 面团更饱满；闪光轨迹保持覆盖前景 */
.workshop .illustrated-token{filter:drop-shadow(0 8px 6px #69442b66)}
.slice-canvas{z-index:12}
/* 跑酷按键和卡通物件 */
.runner-player{bottom:38px;width:98px;height:98px;filter:drop-shadow(0 10px 7px #34435273)}.runner-player .ico{width:98px;height:98px}
.runner-item{filter:drop-shadow(0 4px 4px #34435266);background:radial-gradient(circle,#fffefa99 25%,transparent 72%);border-radius:50%;width:64px;height:64px}.runner-item .ico{width:64px;height:64px}
/* 食材托盘浮起，分区用大色块但通透 */
.ingredient-tray{top:22px;left:12px;right:12px;min-height:89px;border:2px solid #fff7e6;background:#fff9eee8;border-radius:25px;box-shadow:0 6px 18px #62452d52, inset 0 0 0 2px #f0d3a6;backdrop-filter:blur(4px)}
.drag-item{border:0;border-radius:18px;background:#fffbf4;box-shadow:0 3px 8px #6f472c33;width:72px;height:73px}.drag-item .ico{width:61px;height:61px}.drag-item.dragging{box-shadow:0 6px 20px #47311b66}
.drop-zone{bottom:19px;width:44%;height:146px;border:3px dashed #f9d3a0;background:#fff1dbee;box-shadow:0 5px 14px #6f472b30;backdrop-filter:blur(3px);border-radius:21px;color:#81512a}
.drop-zone.cooked{background:#eaf7e0ec;border-color:#9aca96;color:#467850}
.drop-zone .ico{width:55px;height:55px}
/* 巡查物件去掉盒子感，融入场景 */
.hazard{width:64px;height:66px;background:radial-gradient(circle,#fffef1da 20%,#fffef10d 75%);border:0;border-radius:50%;box-shadow:0 7px 13px #3e322638;filter:drop-shadow(0 3px 2px #2d2b2033)}
.hazard .ico{width:64px;height:64px}.hazard.fixed{box-shadow:0 0 0 4px #f0ffbe,0 6px 18px #47773c90;background:#defab7ee}
/* 首页延续B版，降低卡片拥挤感 */
.home-grid{gap:12px;padding:11px 13px 25px}
.story-card{border:2px solid #ead0a5;background:#fff9e9;box-shadow:0 5px #dcc193,0 11px 16px #815a2d29;border-radius:25px;padding:8px 8px 12px}
.story-card .art-frame{height:145px;border:0;border-radius:18px;background:#c5dbbe}
.story-card.last .art-frame{height:143px}
.story-card h3{color:#71452b;margin:10px 6px 3px;font-size:18px}
.story-card p{color:#92714d;margin:0 6px 7px}
.story-card .stamp{border:0;border-radius:100px;background:#eaf5dd;color:#599045;padding:4px 8px}
.story-card .go{margin-top:8px;border:0;box-shadow:none;background:#ffebad;color:#89531c;padding:9px}
.section-title strong{font-size:19px}
.home-foot{background:#fff3d8;padding-top:20px}
@media(max-width:380px){.scene-window{min-height:360px}.paper-heading{padding:12px}.game-title{font-size:25px}.chapter-miniart{flex-basis:92px;height:86px}.drag-item{width:60px;height:66px}.drag-item .ico{width:51px;height:51px}.scene-caption{font-size:11px}.illustrated-token{width:64px;height:70px}.illustrated-token .ico{width:64px;height:64px}}

/* 游戏操作入口上移，进入后无需向下滚动寻找按钮 */
.game-screen>.controls{margin:18px 2px 9px}.game-screen>.hud{margin:11px 2px 10px}.game-screen>.guide{margin-top:7px}.control-note{margin-top:8px}
.runner-scene .lane-mark{display:block!important;top:53%;opacity:.36;pointer-events:none;animation:drive .7s linear infinite}
@keyframes tokenBreath{0%,100%{filter:drop-shadow(0 5px 4px #62402246)}50%{filter:drop-shadow(0 9px 7px #62402266)}}
.mine-land .illustrated-token{animation:tokenBreath 2.2s ease-in-out infinite}.mine-land .illustrated-token:nth-child(even){animation-delay:-1s}
.workshop .illustrated-token{animation:tokenBreath 1.6s ease-in-out infinite}
@media(max-height:760px){.scene-window{height:365px;min-height:350px}.game-screen{padding-top:10px}.paper-heading{min-height:98px}}

/* 新版第四站：火候煮面，沉浸式烹饪 */
.scene-window.cooking-game{background:linear-gradient(180deg,#dbe6dc 0%,#f3e9d6 48%,#a66e3c 100%)}
.cooking-game::before{content:"";position:absolute;inset:0;background:linear-gradient(#fff9e4a6,#edc69a20 35%,#4f29215c);z-index:0;pointer-events:none}
.cook-warm-haze{position:absolute;inset:0;background:radial-gradient(ellipse at 51% 65%,#fff1ce66,transparent 66%);z-index:1;pointer-events:none}
.cook-ui-top{z-index:8;position:absolute;top:15px;left:13px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:1000;color:#7d4b2b}
.cook-round{border:2px solid #e4c489;background:#fff8e9e9;border-radius:99px;padding:6px 13px;font-size:13px;box-shadow:0 3px #b387585c}
.cook-dish{font-size:16px;color:#82421c;text-shadow:0 2px 4px #fff}
.cook-hint{position:absolute;z-index:8;top:59px;left:15px;right:15px;text-align:center;background:#fff9e8e8;border:2px solid #f6dcab;border-radius:12px;padding:7px 8px;font-size:13px;font-weight:850;color:#7b5537}
.cook-thermo{position:absolute;z-index:8;left:8%;right:8%;top:106px;background:#fffcf0e6;border:2px solid #ecce9a;box-shadow:0 4px 12px #553f2740;border-radius:20px;padding:14px 15px 10px}
.cook-meter{height:23px;position:relative;border-radius:30px;background:linear-gradient(90deg,#80cceb,#a8cc95 38%,#f5dd8a 67%,#e98651);box-shadow:inset 0 2px 6px #3e392736}
.cook-meter.correct{box-shadow:inset 0 2px 6px #3e392736,0 0 0 3px #92cf769c}
.cook-safe{position:absolute;z-index:1;top:-3px;bottom:-3px;border-radius:10px;border:3px solid #539b51;box-shadow:0 0 0 2px #fff9; background:linear-gradient(#c1eda0ae,#83cc73ae)}
.cook-pointer{position:absolute;z-index:2;top:-9px;width:7px;height:40px;margin-left:-3px;border-radius:4px;background:#875431;box-shadow:0 1px 3px #4d2b21,0 0 0 2px white;transition:left .1s linear}
.cook-pointer.good{background:#37814a;box-shadow:0 0 0 3px #eeffe1,0 0 13px #b9ff80}
.cook-scale{display:flex;justify-content:space-between;color:#916b48;font-weight:850;font-size:11px;margin-top:8px}
.cook-pot-wrap{position:absolute;z-index:4;width:270px;max-width:81%;left:50%;top:50%;transform:translate(-50%,-28%);height:180px;filter:drop-shadow(0 12px 12px #44241955)}
.cook-pot-art{width:100%;height:100%;display:block}
.cook-ingredient{position:absolute;width:56px;height:56px;top:32px;left:calc(50% - 27px);filter:drop-shadow(0 4px 2px #3e2f1833);animation:cookBob 1.3s ease-in-out infinite}
.cook-ingredient .ico{width:56px;height:56px}
@keyframes cookBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.cooked-pop{animation:cookPop .5s ease-out,cookBob 1.3s ease-in-out infinite .5s}
@keyframes cookPop{from{opacity:.5;transform:scale(.5) rotate(-25deg)}to{opacity:1;transform:scale(1)}}
.cook-flame{position:absolute;bottom:1px;left:50%;transform:translateX(-50%) scale(var(--fire,.6));display:flex;align-items:flex-end;gap:3px;z-index:-1;transition:transform .15s}
.cook-flame i{width:22px;height:42px;border-radius:100% 0 100% 100%;background:linear-gradient(45deg,#ee7535,#ffd357);transform:rotate(-30deg);filter:drop-shadow(0 0 12px #ffae39)}.cook-flame i:nth-child(2){height:56px;background:linear-gradient(45deg,#fc9a40,#fff097)}
.cook-steam{position:absolute;z-index:4;top:-2px;left:32%;right:32%;display:flex;justify-content:space-between;pointer-events:none}.cook-steam i{width:8px;height:28px;background:linear-gradient(transparent,#fffdedc5);border-radius:20px;animation:steamRise 2.1s ease-in-out infinite}.cook-steam i:nth-child(2){animation-delay:.7s}.cook-steam i:nth-child(3){animation-delay:1.3s}@keyframes steamRise{0%{opacity:0;transform:translateY(13px) scale(.8)}60%{opacity:.7}100%{opacity:0;transform:translateY(-32px) scale(1.4)}}
.cook-in-zone .cook-steam i{background:linear-gradient(transparent,#d6ffefff)}
.cook-progress-panel{position:absolute;z-index:8;left:11%;right:11%;bottom:19px;display:flex;align-items:center;gap:9px;color:#7b4a25;font-size:12px;font-weight:1000;background:#fffae8ed;border:2px solid #efcf97;border-radius:99px;padding:10px 13px;box-shadow:0 5px 12px #69451e2d}
.cook-progress-track{height:13px;flex:1;background:#e6cc9c;border-radius:40px;overflow:hidden;box-shadow:inset 0 2px 3px #6a4f2438}
#cookProgress{height:100%;width:0;background:linear-gradient(90deg,#87d478,#c6f378);border-radius:40px;transition:width .12s}
#cookPercent{min-width:33px;text-align:right;font-size:12px}
.cook-bowl-preview{position:absolute;z-index:2;bottom:56px;right:-9px;transform:scale(.86);pointer-events:none;opacity:.94}
.cook-hot{animation:cookWarn .3s linear alternate infinite}@keyframes cookWarn{from{box-shadow:inset 0 0 0 5px #ef8b6552}to{box-shadow:inset 0 0 0 11px #f1755542}}
.cook-control{font-size:14px;white-space:nowrap;padding-left:4px;padding-right:4px}
/* 新版第五站：画线救面面，风险防护可视化 */
.scene-window.shield-scene{background:#e1eadf}
.shield-scene::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#effaf5c0,#d5efd9a0 65%,#fff7debb 100%);z-index:0;pointer-events:none}
.shield-soften{position:absolute;inset:0;background:radial-gradient(circle at 50% 65%,#fef8d7,transparent 58%);z-index:1;pointer-events:none}
.shield-top{position:absolute;left:11px;right:11px;top:14px;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:1000;color:#68462a;font-size:12px}
.shield-top span{background:#fffbeddf;padding:7px 12px;border-radius:18px;border:2px solid #e9d6ae;box-shadow:0 3px 8px #7a5b2a1f}
.shield-ink{font-size:11px}
.shield-hint{position:absolute;z-index:9;top:67px;left:5%;right:5%;text-align:center;color:#4b8a9b;background:#e8fbffec;border:2px dashed #83bbcf;border-radius:15px;padding:10px 8px;font-weight:950;font-size:14px;pointer-events:none}
.shield-target{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;pointer-events:none;width:190px;height:155px}
.shield-target .mascot{width:125px;animation:bob 2s ease-in-out infinite}
.shield-target span{position:absolute;bottom:12px;color:#85512c;font-weight:950;font-size:12px;background:#fff7dfef;border-radius:99px;padding:4px 11px;border:2px solid #e4c591}
.shield-halo{position:absolute;bottom:15px;width:155px;height:86px;background:#fff0a4a8;border-radius:50%;filter:blur(16px)}
.shield-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:11;cursor:crosshair}
.shield-threat{position:absolute;z-index:8;width:53px;height:55px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff7e9,#ffe2d2 65%,#f1b6a5);border:3px solid #fff7e9;box-shadow:0 5px 14px #6744294f,0 0 0 2px #df9c86;filter:drop-shadow(0 2px 2px #64402936);pointer-events:none}
.shield-threat .ico{width:45px;height:45px}
.shield-shake{animation:shieldShake .4s linear}@keyframes shieldShake{0%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.shield-scene .scene-caption,.cooking-game .scene-caption{display:none}

.shield-forecast{position:absolute;left:12%;right:12%;top:136px;display:flex;justify-content:space-between;pointer-events:none;z-index:3;transition:opacity .35s ease,transform .35s ease}
.shield-forecast>div{width:50px;height:50px;display:grid;place-items:center;border:2px dashed #dfaa9b;border-radius:18px;background:linear-gradient(#fff7eeb5,#ffe5dfbd);box-shadow:0 5px 10px #76523826;animation:forecastFloat 2s ease-in-out infinite}
.shield-forecast>div:nth-child(2){animation-delay:.4s}.shield-forecast>div:nth-child(3){animation-delay:.8s}
.shield-forecast .ico{width:43px;height:43px;opacity:.86}
.shield-live .shield-forecast{opacity:0;transform:translateY(-14px)}
@keyframes forecastFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* 新版三个不同玩法：平台跳跃 / 节奏烹饪 / 风险分流。绘本UI系统与前两站保持一致。 */
.platform-scene{background:#a7def0!important;overflow:hidden}
.platform-canvas{width:100%;height:100%;display:block;touch-action:none}
.platform-bubble{position:absolute;z-index:5;top:70px;left:50%;transform:translate(-50%,-8px) scale(.88);padding:7px 17px;border:2px solid #e8c188;border-radius:99px;color:#865023;font-size:14px;font-weight:900;background:#fffae9e8;box-shadow:0 5px 12px #5f6a4144;opacity:0;pointer-events:none}
.platform-bubble.bubble-show{animation:platformHint .75s ease-out both}
@keyframes platformHint{0%{opacity:0;transform:translate(-50%,4px) scale(.85)}25%{opacity:1;transform:translate(-50%,-7px) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-32px) scale(1.04)}}
.platform-control{font-size:17px!important;user-select:none;touch-action:none;min-height:64px!important;border-radius:22px!important;white-space:nowrap;padding:8px!important}
.platform-control.pressing{background:#f6d17a;transform:translateY(3px);box-shadow:0 1px 0 #9d7952}
.platform-scene+.controls{gap:9px}
/* 节奏厨房：暖色绘本舞台、左侧判定圈和前景音符。 */
.rhythm-world{background:linear-gradient(160deg,#f9e8bf,#f4d8ad 60%,#d69b68 100%)!important;overflow:hidden}
.rhythm-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 18%,#fffcdfb0 0,transparent 49%),linear-gradient(90deg,#e2aa7d2b 0 8%,transparent 8% 93%,#c18d632a 93%)}
.rhythm-bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:25%;background:repeating-linear-gradient(90deg,#c48b59 0 48px,#bc8454 48px 52px);border-top:5px solid #ac7747}

.platform-bubble{position:absolute;z-index:5;top:70px;left:50%;transform:translate(-50%,-8px) scale(.88);padding:7px 17px;border:2px solid #e8c188;border-radius:99px;color:#865023;font-size:14px;font-weight:900;background:#fffae9e8;box-shadow:0 5px 12px #5f6a4144;opacity:0;pointer-events:none}
.platform-bubble.bubble-show{animation:platformHint .75s ease-out both}
@keyframes platformHint{0%{opacity:0;transform:translate(-50%,4px) scale(.85)}25%{opacity:1;transform:translate(-50%,-7px) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-32px) scale(1.04)}}
.platform-control{font-size:17px!important;user-select:none;touch-action:none;min-height:64px!important;border-radius:22px!important;white-space:nowrap;padding:8px!important}
.platform-control.pressing{background:#f6d17a;transform:translateY(3px);box-shadow:0 1px 0 #9d7952}
.platform-scene+.controls{gap:9px}
/* 节奏厨房：暖色绘本舞台、左侧判定圈和前景音符。 */
.rhythm-world{background:linear-gradient(160deg,#f9e8bf,#f4d8ad 60%,#d69b68 100%)!important;overflow:hidden}
.rhythm-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 18%,#fffcdfb0 0,transparent 49%),linear-gradient(90deg,#e2aa7d2b 0 8%,transparent 8% 93%,#c18d632a 93%)}
.rhythm-bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:25%;background:repeating-linear-gradient(90deg,#c48b59 0 48px,#bc8454 48px 52px);border-top:5px solid #ac7747}
.rhythm-lamp{position:absolute;left:8%;right:8%;top:12%;color:#d3a24e;font-size:26px;letter-spacing:35px;text-align:center;opacity:.35}
.rhythm-shelf{position:absolute;top:64px;left:6%;right:6%;height:20px;background:#bb8a5c;border-radius:12px;box-shadow:0 7px 0 #a06f48;font-size:22px;text-align:center;opacity:.65}
.rhythm-top{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;z-index:4;gap:8px}
.rhythm-chapter{background:#e4f5cc;color:#447b3f;border:2px solid #a6ce7d;border-radius:999px;font-size:13px;font-weight:1000;padding:7px 13px;box-shadow:0 4px #86b75e}
.rhythm-counter{color:#815330;font-size:12px;font-weight:900;padding:8px 10px;border:1px solid #d9ad75;border-radius:14px;background:#fff7e0}
.rhythm-chef{position:absolute;top:91px;left:11%;right:11%;height:130px;display:flex;align-items:center;justify-content:space-around;z-index:2;filter:drop-shadow(0 8px 6px #995d3040)}
.rhythm-plate{height:112px;width:120px;display:grid;place-items:center;transform:rotate(-9deg);animation:rhPlate 1.4s ease-in-out infinite alternate}
.rhythm-plate .ico{height:115px;width:115px}
.rhythm-pan{height:90px;width:98px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#a4a9a9 0 42%,#596a71 48% 53%,transparent 56%);transform:rotate(8deg)}
.rhythm-pan .ico{height:68px;width:68px}
.rhythm-steam{position:absolute;left:40%;top:-21px;color:#fff9e2;font-size:23px;letter-spacing:4px;text-shadow:0 2px #c4ac887e;animation:rhPlate 2s infinite alternate}
@keyframes rhPlate{to{transform:translateY(-5px) rotate(4deg)}}
.rhythm-combo{position:absolute;z-index:3;top:215px;left:0;right:0;text-align:center;font-size:19px;font-weight:1000;color:#b36c27;text-shadow:0 2px 0 #fff1b9;letter-spacing:.035em;min-height:30px}
.rhythm-pulse{animation:rhPulse .4s ease-out}@keyframes rhPulse{30%{transform:scale(1.16);color:#d65a37}100%{transform:scale(1)}}
.rhythm-rail{position:absolute;top:274px;height:62px;left:0;right:0;background:linear-gradient(#ddaf77aa,#af8259b0);border-top:4px solid #fff1cf;border-bottom:4px solid #956d46;z-index:2}
.rhythm-rail::before{content:"";position:absolute;top:28px;left:16px;right:16px;border-top:3px dashed #fff3d2aa;z-index:0}
.rhythm-hit{position:absolute;z-index:5;left:90px;top:-8px;width:69px;height:69px;transform:translateX(-50%);border:6px solid #fff8cf;border-radius:50%;background:radial-gradient(circle,#fbdf6a,#e3a544);box-shadow:0 0 0 4px #bd7138,0 6px 10px #70462866;display:grid;place-items:center;color:#905521;font-weight:1000;font-size:15px;transition:background .12s}
.rhythm-hit.onbeat{background:radial-gradient(circle,#d5fb91,#72c676);box-shadow:0 0 0 4px #70ac52,0 0 23px #ffed9f}
.rhythm-notes{position:absolute;inset:0;pointer-events:none;z-index:4}
.rhythm-falling{position:absolute;top:2px;width:63px;height:53px;transform:translateX(-50%);border:3px solid #fff6d1;border-radius:19px;background:linear-gradient(#fff0ba,#f7bd56);box-shadow:0 5px 10px #7950347a;color:#936022;text-align:center;font-weight:1000;display:flex;align-items:center;justify-content:center;gap:3px}
.rhythm-falling div{font-size:27px}.rhythm-falling span{font-size:12px}
.rhythm-falling.swipe{background:linear-gradient(#c9eaf5,#91d1e5);color:#326e89}.rhythm-falling.hold{background:linear-gradient(#daebc3,#9ad275);color:#4b7940}
.rhythm-tutorial{position:absolute;left:18px;right:18px;bottom:55px;text-align:center;background:#fffaf0ec;border:2px solid #efcf99;border-radius:16px;color:#784c26;font-size:13px;font-weight:900;padding:10px 9px;box-shadow:0 4px 7px #714c1f29;z-index:3}
.rhythm-bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:4px;font-weight:900;font-size:12px;color:#6f4c2d;z-index:3}.rhythm-bottom span:last-child{color:#bb6a34}
#controls:has(#rhythmTap){display:flex;flex-wrap:wrap;gap:8px}#controls #rhythmStart{flex:1 1 100%}#controls .rh-control{flex:1 1 28%;min-width:0;border-radius:16px;font-size:14px;padding:7px 1px;touch-action:none;min-height:56px}
.rh-control.rhythm-pressed{background:#ffe4a3;box-shadow:0 1px #ab8659;transform:translateY(3px)}
/* 监管守护：三出口、双道岔、动态批次。 */
.belt-world{background:linear-gradient(155deg,#e1f0dd,#f9ead1 52%,#ead3b2)!important;overflow:hidden}
.belt-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(#fff8e27a,#fff6e214),repeating-linear-gradient(0deg,transparent 0 37px,#b8b89b29 37px 39px),repeating-linear-gradient(90deg,transparent 0 41px,#9caa9950 41px 43px)}
.belt-banner{position:absolute;z-index:8;top:6px;left:9px;right:9px;background:#fffaf0f5;border:2px solid #ecd19c;border-radius:16px;box-shadow:0 5px 12px #82603b22;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:5px;color:#7a4d2a;font-size:13px}
.belt-banner div:first-child{display:flex;flex-direction:column;gap:3px}.belt-banner span{font-size:11px}.belt-progress{color:#5e9253;font-weight:1000;font-size:15px;white-space:nowrap}
.belt-next{border-radius:5px;padding:2px 6px}.belt-next.ok{background:#e3f3d8;color:#4b9952}.belt-next.hold{background:#fff0c3;color:#b37926}.belt-next.risk{background:#fae0d7;color:#b65c4e}
.belt-map{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.belt-switch{position:absolute;z-index:9;width:76px;min-height:65px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;border:3px solid #fef9e9;border-radius:18px;box-shadow:0 5px #9a7653,0 7px 12px #533a2a51;background:linear-gradient(#ffd575,#eeae44);color:#6f4728;font-weight:900;touch-action:manipulation}
.belt-switch span{font-size:22px;line-height:1}.belt-switch b{font-size:10px;white-space:nowrap}.belt-switch.sw-a{left:40%;top:50%}.belt-switch.sw-b{left:80.3%;top:27.3%;width:73px;min-height:61px;background:linear-gradient(#c7e7cd,#7dc7aa)}
.belt-switch.toward-risk{background:linear-gradient(#ffd0b8,#e78869)}.belt-switch.toward-review{background:linear-gradient(#ffe7b4,#efc077)}
.belt-cartons{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.belt-box{position:absolute;transform:translate(-50%,-50%);width:56px;height:71px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:#fff7e5;border-radius:12px;border:3px solid #d7ad70;box-shadow:0 6px 9px #63482f80;font-size:11px;color:#68462f;pointer-events:none}
.belt-box .belt-icon{height:35px;width:38px;display:grid;place-items:center}.belt-box .ico{width:38px;height:38px}
.belt-box strong{font-size:13px;line-height:1}.belt-box small{font-size:8px;color:#927355}.belt-box.risk{border-color:#d96b58;background:#ffede4}.belt-box.hold{border-color:#dfa94e;background:#fff4d9}.belt-box.ok{border-color:#83b778;background:#f0fbea}
.belt-footer{position:absolute;z-index:7;bottom:7px;left:9px;right:9px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px;background:#fffaf0d9;border:1px solid #e3bf85;border-radius:11px;color:#79512e;font-size:11px;font-weight:850;padding:7px 8px}
#controls:has(#beltStart){flex-wrap:wrap;gap:8px}#controls #beltStart{flex:1 1 100%}#controls #beltToggleA,#controls #beltToggleB{flex:1 1 44%;font-size:12px;padding:6px 5px;min-width:0;min-height:52px;border-radius:14px}
@media(max-width:380px){.belt-switch{width:63px;min-height:57px}.belt-switch b{font-size:9px}.belt-box{width:50px;height:64px}.belt-box .ico{height:32px;width:32px}.belt-box .belt-icon{height:31px}.rhythm-hit{left:90px}.rhythm-chef{top:77px}.rhythm-combo{top:201px}.rhythm-rail{top:254px}.rhythm-tutorial{bottom:52px}}

/* 第五站：从俯视网格改为独立的物理弹射舞台 */
.slingshot-world{position:relative;overflow:hidden;background:linear-gradient(160deg,#d5eced,#f8e7c3 60%,#c09c71)!important;touch-action:none}
.slingshot-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.shot-status{position:absolute;top:12px;left:9px;right:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;z-index:3}
.shot-stage,.shot-count{border:2px solid #c99c64;background:#fff7e4ee;border-radius:999px;padding:6px 10px;color:#785130;font-size:11px;font-weight:900;box-shadow:0 3px #b28c5b77}
.shot-count{color:#b65e3f;background:#fff0d8ee;white-space:nowrap;letter-spacing:1px;font-size:10px}
.shot-guide{position:absolute;top:52px;bottom:auto;left:12px;right:127px;padding:7px 9px;background:#fff9e8ed;border:2px solid #e1c088;border-radius:16px;box-shadow:0 5px 10px #4c3a2442;z-index:3;pointer-events:none;text-align:center;font-size:12px;color:#795338;font-weight:750;line-height:1.6;transition:opacity .2s;max-height:92px}
.shot-guide.shot-hide{opacity:0}
.slingshot-world .scene-caption{font-size:10px;bottom:2px;opacity:.78;pointer-events:none}
#controls:has(#shotReset){display:flex;gap:9px}
#controls #shotReset,#controls #shotHelp{flex:1;font-size:14px;white-space:nowrap;padding:12px 6px}
@media(max-width:350px){.shot-stage,.shot-count{font-size:9px;padding:5px 7px}.shot-guide{font-size:10px;left:10px;right:105px}#controls #shotReset,#controls #shotHelp{font-size:12px}}
</style>

.platform-scene{background:#a7def0!important;overflow:hidden}
.platform-canvas{width:100%;height:100%;display:block;touch-action:none}
.platform-bubble{position:absolute;z-index:5;top:70px;left:50%;transform:translate(-50%,-8px) scale(.88);padding:7px 17px;border:2px solid #e8c188;border-radius:99px;color:#865023;font-size:14px;font-weight:900;background:#fffae9e8;box-shadow:0 5px 12px #5f6a4144;opacity:0;pointer-events:none}
.platform-bubble.bubble-show{animation:platformHint .75s ease-out both}
@keyframes platformHint{0%{opacity:0;transform:translate(-50%,4px) scale(.85)}25%{opacity:1;transform:translate(-50%,-7px) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-32px) scale(1.04)}}
.platform-control{font-size:17px!important;user-select:none;touch-action:none;min-height:64px!important;border-radius:22px!important;white-space:nowrap;padding:8px!important}
.platform-control.pressing{background:#f6d17a;transform:translateY(3px);box-shadow:0 1px 0 #9d7952}
.platform-scene+.controls{gap:9px}
/* 节奏厨房：暖色绘本舞台、左侧判定圈和前景音符。 */
.rhythm-world{background:linear-gradient(160deg,#f9e8bf,#f4d8ad 60%,#d69b68 100%)!important;overflow:hidden}
.rhythm-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 18%,#fffcdfb0 0,transparent 49%),linear-gradient(90deg,#e2aa7d2b 0 8%,transparent 8% 93%,#c18d632a 93%)}
.rhythm-bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:25%;background:repeating-linear-gradient(90deg,#c48b59 0 48px,#bc8454 48px 52px);border-top:5px solid #ac7747}
.rhythm-lamp{position:absolute;left:8%;right:8%;top:12%;color:#d3a24e;font-size:26px;letter-spacing:35px;text-align:center;opacity:.35}
.rhythm-shelf{position:absolute;top:64px;left:6%;right:6%;height:20px;background:#bb8a5c;border-radius:12px;box-shadow:0 7px 0 #a06f48;font-size:22px;text-align:center;opacity:.65}

/* 欢快轻快的原创合成背景音乐：无需联网或额外音频文件 */
(function initNoodleBackgroundMusic(){
  const button=document.getElementById('musicToggle');
  if(!button) return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  let audio=null, master=null, scheduler=null, enabled=true, started=false, nextTime=0, step=0, theme='game';
  const bpm=112, beat=60/bpm, tick=beat/2;
  const melody=[
    72,76,79,84,81,79,76,null, 74,77,81,86,84,81,77,null,
    76,79,84,88,86,84,79,null, 72,76,79,83,81,79,76,null,
    79,83,86,91,88,86,83,null, 77,81,84,89,88,84,81,null,
    76,79,84,88,84,81,79,76, 74,77,81,86,81,79,77,null
  ];
  const roots=[48,43,45,41,48,41,43,48];
  const arpeggios=[[60,64,67,64],[55,59,62,59],[57,60,64,60],[53,57,60,57],[60,64,67,64],[53,57,60,57],[55,59,62,59],[60,64,67,64]];
  // 明亮的通关庆祝主题：更快、更高音域，带街机胜利旋律。
  const victoryMelody=[
    84,null,91,96,100,null,96,91, 84,null,91,96,103,null,100,96,
    86,null,93,98,101,null,98,93, 86,null,93,98,105,null,101,98,
    88,null,95,100,103,null,100,95, 88,null,95,100,107,null,103,100,
    91,null,98,103,107,null,103,98, 91,null,98,103,110,null,107,103
  ];
  const victoryRoots=[48,53,55,60,48,55,53,60];
  const victoryArps=[[72,79,84,91],[77,84,89,96],[79,86,91,98],[84,91,96,103],[72,79,84,91],[79,86,91,98],[77,84,89,96],[84,91,96,103]];
  const hz=midi=>440*Math.pow(2,(midi-69)/12);
  function tone(midi,when,duration,wave,volume,release=0.07){
    if(!audio||!master||!Number.isFinite(midi))return;
    const osc=audio.createOscillator(), amp=audio.createGain();
    osc.type=wave;osc.frequency.setValueAtTime(hz(midi),when);
    amp.gain.setValueAtTime(0.0001,when);
    amp.gain.exponentialRampToValueAtTime(Math.max(0.0002,volume),when+0.012);
    amp.gain.setValueAtTime(Math.max(0.0002,volume),when+Math.max(0.02,duration-release));
    amp.gain.exponentialRampToValueAtTime(0.0001,when+duration);
    osc.connect(amp);amp.connect(master);osc.start(when);osc.stop(when+duration+0.025);
  }
  function softKick(when){
    if(!audio||!master)return;
    const osc=audio.createOscillator(),amp=audio.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(105,when);osc.frequency.exponentialRampToValueAtTime(48,when+0.11);
    amp.gain.setValueAtTime(0.0001,when);amp.gain.exponentialRampToValueAtTime(0.055,when+0.008);amp.gain.exponentialRampToValueAtTime(0.0001,when+0.13);
    osc.connect(amp);amp.connect(master);osc.start(when);osc.stop(when+0.14);
  }
  function scheduleStep(n,when){
    const i=n%64, bar=Math.floor(i/8), within=i%8;
    if(theme==='victory'){
      const note=victoryMelody[i];
      if(note!==null&&note!==undefined) tone(note,when,tick*0.78,'square',0.12,0.075);
      if(i%2===0){const chord=victoryArps[bar][Math.floor(within/2)];tone(chord,when,tick*0.82,'triangle',0.052,0.09)}
      if(i%8===0){tone(victoryRoots[bar],when,beat*0.72,'sine',0.085,0.12);tone(victoryRoots[bar]+12,when,beat*0.32,'square',0.032,0.07);softKick(when)}
      if(i%8===4){tone(victoryRoots[bar]+19,when,beat*0.32,'triangle',0.042,0.07)}
      if(i%16===0) tone(victoryRoots[bar]+24,when+.012,beat*.22,'sine',0.035,0.06);
      return;
    }
    const note=melody[i];
    if(note!==null&&note!==undefined) tone(note,when,tick*0.88,'triangle',0.105,0.10);
    if(i%2===0){const chord=arpeggios[bar][Math.floor(within/2)];tone(chord,when,tick*0.95,'sine',0.035,0.12)}
    if(i%8===0){tone(roots[bar],when,beat*0.72,'sine',0.075,0.13);softKick(when)}
    if(i%8===4){tone(roots[bar]+12,when,beat*0.35,'sine',0.025,0.08)}
  }
  function setTheme(nextTheme){
    theme=nextTheme==='victory'?'victory':'game';
    step=0;
    if(audio&&started&&enabled&&audio.state==='running'){
      nextTime=audio.currentTime+0.08;
      if(theme==='victory'){
        const t=audio.currentTime+0.035;
        tone(72,t,.22,'square',.10,.09);
        tone(79,t+.09,.22,'square',.10,.09);
        tone(84,t+.18,.28,'square',.11,.10);
        tone(91,t+.27,.36,'triangle',.12,.13);
        tone(96,t+.30,.42,'sine',.075,.16);
      }
    }
  }
  function updateButton(){
    button.classList.toggle('is-muted',!enabled);
    button.textContent=enabled?'♫':'♪';
    button.setAttribute('aria-pressed',String(enabled));
    button.title=enabled?(started?'关闭欢快背景音乐':'背景音乐已开启，首次触碰屏幕后开始播放'):'开启欢快背景音乐';
    button.setAttribute('aria-label',enabled?'关闭背景音乐':'开启背景音乐');
  }
  async function startMusic(){
    if(!enabled||started)return;
    if(!AudioCtx){button.title='当前浏览器不支持背景音乐';return}
    try{
      if(!audio){audio=new AudioCtx();master=audio.createGain();master.gain.value=0.0001;master.connect(audio.destination)}
      await audio.resume();
      master.gain.cancelScheduledValues(audio.currentTime);master.gain.setValueAtTime(Math.max(0.0001,master.gain.value),audio.currentTime);master.gain.linearRampToValueAtTime(0.72,audio.currentTime+0.45);
      started=true;nextTime=audio.currentTime+0.07;
      scheduler=setInterval(()=>{
        if(!audio||audio.state!=='running'||!enabled)return;
        while(nextTime<audio.currentTime+0.13){scheduleStep(step,nextTime);nextTime+=tick;step=(step+1)%64}
      },25);
      updateButton();
    }catch(err){console.warn('背景音乐启动失败',err);button.title='音乐启动失败，请再点一次';started=false;updateButton()}
  }
  function stopMusic(){
    enabled=false;
    if(audio&&master){master.gain.cancelScheduledValues(audio.currentTime);master.gain.setTargetAtTime(0.0001,audio.currentTime,0.06)}
    if(scheduler){clearInterval(scheduler);scheduler=null}
    started=false;updateButton();
  }
  button.addEventListener('click',()=>{
    if(window.__noodleSfx)window.__noodleSfx.play('tap');
    if(!AudioCtx){button.title='当前浏览器不支持背景音乐';return}
    if(!started){enabled=true;startMusic();return}
    if(enabled){stopMusic()}else{enabled=true;startMusic()}
    updateButton();
  });
  // Browsers require a user gesture before sound can begin. Start on the first game tap.
  document.addEventListener('pointerdown',event=>{
    if(event.target&&event.target.closest&&event.target.closest('#musicToggle'))return;
    if(enabled&&!started)startMusic();
  },true);
  document.addEventListener('keydown',event=>{if(enabled&&!started&&event.key!=='Tab')startMusic()},{once:false});
  document.addEventListener('visibilitychange',()=>{
    if(!audio||!started)return;
    if(document.hidden)audio.suspend().catch(()=>{});
    else if(enabled)audio.resume().catch(()=>{});
  });
  window.__noodleBgm={setTheme};
  updateButton();
})();
